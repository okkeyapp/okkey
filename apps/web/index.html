<!doctype html>
<html lang="en" data-accent="a2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Okkey</title>
    <!-- Self-host / Docker: runtime API origin (see apps/web/docker/docker-entrypoint.sh). -->
    <script src="/config.js"></script>
    <!-- Capture capsule key from the URL fragment before the SPA boots (module scripts are deferred). -->
    <script>
      (function () {
        try {
          var match = location.pathname.match(/^\/capsule\/([^/]+)\/?$/);
          if (!match) return;
          var key = new URLSearchParams(String(location.hash || "").replace(/^#/, "")).get("key");
          if (!key) return;
          sessionStorage.setItem("okkey:capsule-key:" + match[1], key);
          history.replaceState(null, "", location.pathname + location.search);
        } catch (_error) {
          /* ignore quota / private-mode failures; React bootstrap still retries */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
