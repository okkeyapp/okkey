<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture Segmented OTP 6</title></head>
  <body>
    <h1>Two-factor authentication</h1>
    <form id="otp6">
      <label>Authenticator code</label>
      <div class="otp-row">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" name="otp1" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" name="otp2" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" name="otp3" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" name="otp4" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" name="otp5" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" name="otp6" />
      </div>
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
