<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture Open Shadow Login</title></head>
  <body>
    <h1>Sign in</h1>
    <div id="host"></div>
    <script>
      const host = document.getElementById("host");
      const root = host.attachShadow({ mode: "open" });
      root.innerHTML = `
        <form id="shadow-login">
          <label for="su">Username</label>
          <input id="su" name="username" type="text" autocomplete="username" />
          <label for="sp">Password</label>
          <input id="sp" name="password" type="password" autocomplete="current-password" />
          <button type="submit">Sign in</button>
        </form>
      `;
    </script>
  </body>
</html>
