<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture OTP</title></head>
  <body>
    <h1>Enter verification code</h1>
    <form id="otp">
      <label for="code">One-Time Password</label>
      <input
        id="code"
        name="otp"
        type="text"
        autocomplete="one-time-code"
        inputmode="numeric"
        maxlength="6"
      />
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
