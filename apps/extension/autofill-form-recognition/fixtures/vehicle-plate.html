<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture Vehicle</title></head>
  <body>
    <h1>Vehicle</h1>
    <form id="vehicle">
      <label for="make">Make / model</label>
      <input id="make" name="makeModel" type="text" />
      <label for="plate">License plate</label>
      <input id="plate" name="licensePlate" type="text" />
      <label for="vin">VIN</label>
      <input id="vin" name="vin" type="text" />
      <label for="inspection">Inspection due</label>
      <input id="inspection" name="inspectionDue" type="text" />
      <label for="insurer">Insurer</label>
      <input id="insurer" name="insurer" type="text" />
      <label for="policy">Insurance policy</label>
      <input id="policy" name="policyNumber" type="text" />
      <label for="until">Insurance valid until</label>
      <input id="until" name="insuranceValidUntil" type="text" />
    </form>
  </body>
</html>
