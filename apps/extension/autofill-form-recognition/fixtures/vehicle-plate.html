<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture Vehicle</title></head>
  <body>
    <h1>Vehicle</h1>
    <form id="vehicle">
      <label for="make">Make / model</label>
      <input id="make" name="make_model" type="text" />
      <label for="plate">License plate</label>
      <input id="plate" name="plate" type="text" />
      <label for="vin">VIN</label>
      <input id="vin" name="vin" type="text" />
      <label for="inspection">Inspection / MOT due</label>
      <input id="inspection" name="inspection" type="text" />
      <label for="insurer">Insurer</label>
      <input id="insurer" name="insurer" type="text" />
      <label for="policy">Policy number</label>
      <input id="policy" name="policy" type="text" />
      <label for="until">Valid until</label>
      <input id="until" name="valid_until" type="text" />
    </form>
  </body>
</html>
