<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture Loyalty EN</title></head>
  <body>
    <h1>Loyalty card</h1>
    <form id="loyalty">
      <label for="program">Program name</label>
      <input id="program" name="provider" type="text" />
      <label for="member">Card number</label>
      <input id="member" name="card_number" type="text" />
      <label for="barcode">Barcode / QR</label>
      <input id="barcode" name="barcode" type="text" />
      <label for="expiry">Expiry date</label>
      <input id="expiry" name="expiry" type="text" />
    </form>
  </body>
</html>
