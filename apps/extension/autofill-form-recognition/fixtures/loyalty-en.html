<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture Loyalty EN</title></head>
  <body>
    <h1>Loyalty card</h1>
    <form id="loyalty">
      <label for="program">Loyalty program</label>
      <input id="program" name="loyaltyProgram" type="text" />
      <label for="member">Membership number</label>
      <input id="member" name="memberNumber" type="text" />
      <label for="barcode">Barcode</label>
      <input id="barcode" name="barcode" type="text" />
      <label for="expiry">Loyalty expiry</label>
      <input id="expiry" name="loyaltyExpiry" type="text" />
    </form>
  </body>
</html>
