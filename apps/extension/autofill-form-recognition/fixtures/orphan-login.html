<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Fixture Orphan Login</title></head>
  <body>
    <h1>Sign in</h1>
    <!-- Logical login form without a wrapping <form> -->
    <div class="login-panel">
      <label for="orphan-user">Username</label>
      <input id="orphan-user" name="username" type="text" autocomplete="username" />
      <label for="orphan-pass">Password</label>
      <input id="orphan-pass" name="password" type="password" autocomplete="current-password" />
      <button type="button">Log in</button>
    </div>
  </body>
</html>
