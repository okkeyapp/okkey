name: okkey-dev

services:
  postgres:
    # postgres:16-alpine
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: okkey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # redis:7-alpine
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    container_name: okkey-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./.data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official minio/minio left Docker Hub (2026-09); Quay anonymous pulls also 401.
  # pgsty/minio is a drop-in Community rebuild (same CLI/env/health) — keep in sync
  # with deploy/docker/docker-compose.prod.yml.
  minio:
    # pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: okkey-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./.data/minio:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  geoip-updater:
    profiles: ["geoip"]
    build:
      context: ./services/geoip-updater
    container_name: okkey-geoip-updater
    restart: unless-stopped
    environment:
      GEOIP_DB_PATH: /geoip/city.mmdb
      GEOIP_UPDATE_INTERVAL_MS: ${GEOIP_UPDATE_INTERVAL_MS:-86400000}
    volumes:
      - geoip-data:/geoip

volumes:
  geoip-data:
