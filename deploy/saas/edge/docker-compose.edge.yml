# SaaS edge-only reverse proxy (stage / prod).
# Primary stack (Q-Day #3): nginx + OpenSSL ≥ 3.5 / X25519MLKEM768 / TLS 1.3 only.
#
# Reuses the self-host nginx image build from deploy/docker/proxy/nginx.
# Pick an overlay env file:
#
#   docker compose -f docker-compose.edge.yml --env-file overlays/stage.env up -d --build
#   docker compose -f docker-compose.edge.yml --env-file overlays/prod.env  up -d --build
#
# Compat port (N8): do NOT publish 8443 here. When OKKEY_COMPAT_ENABLED=1, also include
# docker-compose.compat.yml (see overlays/compat.env.example).
#
# Paths are relative to this directory (deploy/saas/edge).

services:
  edge:
    build:
      context: ../../docker/proxy/nginx
      dockerfile: Dockerfile
      args:
        OPENSSL_VERSION: ${OKKEY_PROXY_OPENSSL_VERSION:-3.5.9}
        NGINX_VERSION: ${OKKEY_PROXY_NGINX_VERSION:-1.28.0}
    image: ${OKKEY_SAAS_EDGE_IMAGE:-okkey-saas-edge-nginx:openssl35}
    restart: unless-stopped
    ports:
      - "${OKKEY_PROXY_HTTP_PORT:-80}:80"
      - "${OKKEY_PROXY_HTTPS_PORT:-443}:443"
    environment:
      OKKEY_WEB_HOST: ${OKKEY_WEB_HOST:?set OKKEY_WEB_HOST in overlay env}
      OKKEY_API_HOST: ${OKKEY_API_HOST:?set OKKEY_API_HOST in overlay env}
      OKKEY_WEB_UPSTREAM: ${OKKEY_WEB_UPSTREAM:?set OKKEY_WEB_UPSTREAM in overlay env}
      OKKEY_API_UPSTREAM: ${OKKEY_API_UPSTREAM:?set OKKEY_API_UPSTREAM in overlay env}
      # Compat classical listeners (q3-4): off by default. See overlays/compat.env.example.
      OKKEY_COMPAT_ENABLED: ${OKKEY_COMPAT_ENABLED:-0}
      OKKEY_COMPAT_WEB_HOST: ${OKKEY_COMPAT_WEB_HOST:-}
      OKKEY_COMPAT_API_HOST: ${OKKEY_COMPAT_API_HOST:-}
      OKKEY_COMPAT_SUNSET: ${OKKEY_COMPAT_SUNSET:-}
      OKKEY_COMPAT_OWNER: ${OKKEY_COMPAT_OWNER:-}
      OKKEY_COMPAT_ALLOW_CIDRS: ${OKKEY_COMPAT_ALLOW_CIDRS:-}
      OKKEY_COMPAT_HTTPS_PORT: ${OKKEY_COMPAT_HTTPS_PORT:-8443}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    # Default TLS policy is compiled into the image template (ssl_protocols TLSv1.3;
    # ssl_ecdh_curve X25519MLKEM768). Do not mount an alternate site conf that
    # re-introduces classical groups or TLS ≤ 1.2 on the default listener.
    # Compat classical hosts are opt-in via OKKEY_COMPAT_* only.
