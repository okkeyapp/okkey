[package]
name = "okkey-crypto-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
okkey-crypto-engine = { path = ".." }

[[bin]]
name = "hybrid_decode"
path = "fuzz_targets/hybrid_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hybrid_decrypt"
path = "fuzz_targets/hybrid_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_verify"
path = "fuzz_targets/signature_verify.rs"
test = false
doc = false
bench = false
