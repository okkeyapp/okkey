openapi: 3.0.3
info:
  title: Okkey Core API
  description: |
    Machine-readable contract for the Core HTTP API (`services/api`).
    Human-readable narrative and policies: `docs/api_contracts.md`.
  version: 0.1.0

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Auth
  - name: Vaults
  - name: Sync
  - name: Devices
  - name: System

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token from session bootstrap or two-factor verify

  schemas:
    ErrorBody:
      type: object
      required: [error, message, requestId]
      properties:
        error:
          type: string
          description: Domain error code
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true

    EmailStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        locale:
          type: string

    EmailChallengeResponse:
      type: object
      required: [challengeId, expiresAt, resendAvailableAt]
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time

    EmailResendRequest:
      type: object
      required: [challengeId]
      properties:
        challengeId:
          type: string
        locale:
          type: string

    EmailConfirmRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
        code:
          type: string

    EmailConfirmResponse:
      type: object
      required: [authStateId, userExists, nextStep]
      properties:
        authStateId:
          type: string
        userExists:
          type: boolean
        nextStep:
          type: string
          enum: [registration, device_check, two_factor]

    SessionBootstrapRequest:
      type: object
      required: [authStateId]
      properties:
        authStateId:
          type: string
        auth_state_id:
          type: string
          format: uuid

    AccessTokenResponse:
      type: object
      required: [access_token, expires_at, user_id, token_type]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        token_type:
          type: string
          enum: [Bearer]

    TwoFactorVerifyRequest:
      type: object
      required: [authStateId, code]
      properties:
        authStateId:
          type: string
        auth_state_id:
          type: string
        code:
          type: string
          description: Six-digit TOTP or backup code (with or without dashes)

    TwoFactorStatusResponse:
      type: object
      required: [enabled, backupCodesRemaining]
      properties:
        enabled:
          type: boolean
        backupCodesRemaining:
          type: integer

    TotpEnrollStartResponse:
      type: object
      required:
        [enrollmentId, secretBase32, otpauthUri, periodSeconds, digits, algorithm]
      properties:
        enrollmentId:
          type: string
          format: uuid
        secretBase32:
          type: string
        otpauthUri:
          type: string
        periodSeconds:
          type: integer
        digits:
          type: integer
        algorithm:
          type: string
          enum: [SHA1]

    TotpEnrollConfirmRequest:
      type: object
      required: [enrollmentId, code]
      properties:
        enrollmentId:
          type: string
          format: uuid
        code:
          type: string

    BackupCodesResponse:
      type: object
      required: [backupCodes]
      properties:
        backupCodes:
          type: array
          items:
            type: string

    BackupCodesRegenerateRequest:
      type: object
      required: [totpCode]
      properties:
        totpCode:
          type: string
        totp_code:
          type: string

    TwoFactorDisableRequest:
      type: object
      properties:
        totpCode:
          type: string
        totp_code:
          type: string
        backupCode:
          type: string
        backup_code:
          type: string

    RegisterCompleteRequest:
      type: object
      required:
        - auth_state_id
        - user_public_key
        - encrypted_private_key
        - server_key_share
        - password_kdf_salt
        - password_kdf_params_version
        - device_public_key
        - device_share
        - device_fingerprint
        - device_name
      properties:
        auth_state_id:
          type: string
          format: uuid
        user_public_key:
          type: string
        encrypted_private_key:
          type: string
        server_key_share:
          type: string
        password_kdf_salt:
          type: string
        password_kdf_params_version:
          type: integer
          enum: [1]
        device_public_key:
          type: string
        device_share:
          type: string
        device_fingerprint:
          type: string
        device_name:
          type: string
        platform:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        app_version:
          type: string
        client_type:
          type: string
        user_agent:
          type: string
        metadata:
          type: object

    RegisterCompleteResponse:
      type: object
      required: [user_id, workspace_id, vault_id, device_id, device_status]
      properties:
        user_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        vault_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        device_status:
          type: string
          enum: [trusted]

    Vault:
      type: object
      required: [id, workspaceId, name, isPersonal, ownerId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        isPersonal:
          type: boolean
        ownerId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SyncEvent:
      type: object
      required:
        [
          id,
          vaultId,
          actorId,
          eventType,
          encryptedPayload,
          payloadSchemaVersion,
          idempotencyKey,
          clientCreatedAt,
          version,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        vaultId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
        eventType:
          type: string
          enum:
            - ITEM_CREATE
            - ITEM_UPDATE
            - ITEM_DELETE
            - VAULT_CREATE
            - VAULT_SHARE
            - VAULT_KEY_ROTATION
            - DEVICE_ADD
            - DEVICE_REMOVE
        encryptedPayload:
          type: string
          description: Standard base64 ciphertext
        payloadSchemaVersion:
          type: integer
          minimum: 1
          maximum: 65535
        idempotencyKey:
          type: string
          format: uuid
          nullable: true
        clientCreatedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    SyncEventsListResponse:
      type: object
      required: [vaultId, afterVersion, events]
      properties:
        vaultId:
          type: string
          format: uuid
        afterVersion:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: "#/components/schemas/SyncEvent"

    SyncAppendRequest:
      type: object
      required: [eventType, encryptedPayload, baseVersion]
      properties:
        eventType:
          type: string
        encryptedPayload:
          type: string
        baseVersion:
          type: integer
          minimum: 0
        payloadSchemaVersion:
          type: integer
          minimum: 1
          maximum: 65535
        idempotencyKey:
          type: string
          format: uuid
        clientCreatedAt:
          type: string
          format: date-time

    DeviceRegisterRequest:
      type: object
      required:
        - device_public_key
        - device_share
        - device_fingerprint
        - device_name
      properties:
        device_public_key:
          type: string
        device_share:
          type: string
        device_fingerprint:
          type: string
        device_name:
          type: string
        platform:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        app_version:
          type: string
        client_type:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          properties:
            platform:
              type: string
            os_name:
              type: string
            os_version:
              type: string
            app_version:
              type: string
            client_type:
              type: string
            user_agent:
              type: string

    DeviceRegisterResponse:
      type: object
      required: [device_id, status]
      properties:
        device_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [trusted, pending_approval]

    DeviceResolveResponse:
      type: object
      required: [device_id, status]
      properties:
        device_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [trusted, revoked]

    DeviceRejectRequest:
      type: object
      properties:
        reason:
          type: string

  parameters:
    HeaderUserId:
      name: X-User-Id
      in: header
      required: false
      description: >
        Optional dev fallback (disabled in production unless explicitly allowed).
        Prefer `Authorization: Bearer <access_token>` from
        `POST /auth/session/bootstrap` or `POST /auth/two-factor/verify`.
      schema:
        type: string
        format: uuid
    HeaderDeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness
      responses:
        "200":
          description: OK

  /ready:
    get:
      tags: [System]
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready

  /auth/email/start:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartRequest"
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "400":
          description: Validation / bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/email/resend:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailResendRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/email/confirm:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailConfirmResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/register/complete:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCompleteRequest"
      responses:
        "201":
          description: User registered with default workspace, vault, trusted device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterCompleteResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/session/bootstrap:
    post:
      tags: [Auth]
      summary: Create session after email confirm (no 2FA pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionBootstrapRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/verify:
    post:
      tags: [Auth]
      summary: Complete login with TOTP or backup code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          description: >
            Includes TWO_FACTOR_INVALID_CODE, TWO_FACTOR_BACKUP_INVALID, TWO_FACTOR_BACKUP_DEPLETED,
            TWO_FACTOR_SETUP_INVALID, TWO_FACTOR_NOT_ENABLED, AUTH_BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/status:
    get:
      tags: [Auth]
      summary: Two-factor status for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatusResponse"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/totp/enroll/start:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollStartResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/totp/enroll/confirm:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpEnrollConfirmRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodesResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/backup-codes/regenerate:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupCodesRegenerateRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodesResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/disable:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorDisableRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [disabled]
                properties:
                  disabled:
                    type: boolean
                    enum: [true]
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /workspaces/{workspaceId}/vaults:
    get:
      tags: [Vaults]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vault"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /vaults/{vaultId}:
    get:
      tags: [Vaults]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
        - name: vaultId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /vaults/{vaultId}/events:
    get:
      tags: [Sync]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
        - name: vaultId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: afterVersion
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncEventsListResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

    post:
      tags: [Sync]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
        - name: vaultId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncAppendRequest"
      responses:
        "201":
          description: Event appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncEvent"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Version mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /devices/register:
    post:
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegisterRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegisterResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /devices/{deviceId}/approve:
    post:
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
        - $ref: "#/components/parameters/HeaderDeviceId"
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegisterResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /devices/{deviceId}/reject:
    post:
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
        - $ref: "#/components/parameters/HeaderDeviceId"
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRejectRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResolveResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
