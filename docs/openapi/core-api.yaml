openapi: 3.0.3
info:
  title: Okkey Core API
  description: |
    Machine-readable contract for the Core HTTP API (`services/api`).
    Human-readable narrative and policies: `docs/api_contracts.md`.
  version: 0.1.0

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Auth
  - name: Vaults
  - name: Sync
  - name: Capsules
  - name: Devices
  - name: System

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token from session bootstrap or two-factor verify

  schemas:
    ErrorBody:
      type: object
      required: [error, message, requestId]
      properties:
        error:
          type: string
          description: Domain error code
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true

    EmailStartRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        locale:
          type: string

    EmailChallengeResponse:
      type: object
      required: [challengeId, expiresAt, resendAvailableAt]
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        resendAvailableAt:
          type: string
          format: date-time

    EmailResendRequest:
      type: object
      required: [challengeId]
      properties:
        challengeId:
          type: string
        locale:
          type: string

    EmailConfirmRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
        code:
          type: string

    EmailConfirmResponse:
      type: object
      required: [authStateId, userExists, nextStep]
      properties:
        authStateId:
          type: string
        userExists:
          type: boolean
        nextStep:
          type: string
          enum: [registration, device_check, two_factor]

    SessionBootstrapRequest:
      type: object
      required: [authStateId]
      properties:
        authStateId:
          type: string
        auth_state_id:
          type: string
          pattern: '^d{10,20}


    AccessTokenResponse:
      type: object
      required: [access_token, expires_at, user_id, token_type]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        user_id:
          type: string
          pattern: '^d{10,20}

        token_type:
          type: string
          enum: [Bearer]

    TwoFactorVerifyRequest:
      type: object
      required: [authStateId, code]
      properties:
        authStateId:
          type: string
        auth_state_id:
          type: string
        code:
          type: string
          description: Six-digit TOTP or backup code (with or without dashes)

    TwoFactorStatusResponse:
      type: object
      required: [enabled, backupCodesRemaining]
      properties:
        enabled:
          type: boolean
        backupCodesRemaining:
          type: integer

    TotpEnrollStartResponse:
      type: object
      required:
        [enrollmentId, secretBase32, otpauthUri, periodSeconds, digits, algorithm]
      properties:
        enrollmentId:
          type: string
          pattern: '^d{10,20}

        secretBase32:
          type: string
        otpauthUri:
          type: string
        periodSeconds:
          type: integer
        digits:
          type: integer
        algorithm:
          type: string
          enum: [SHA1]

    TotpEnrollConfirmRequest:
      type: object
      required: [enrollmentId, code]
      properties:
        enrollmentId:
          type: string
          pattern: '^d{10,20}

        code:
          type: string

    BackupCodesResponse:
      type: object
      required: [backupCodes]
      properties:
        backupCodes:
          type: array
          items:
            type: string

    BackupCodesRegenerateRequest:
      type: object
      required: [totpCode]
      properties:
        totpCode:
          type: string
        totp_code:
          type: string

    TwoFactorDisableRequest:
      type: object
      properties:
        totpCode:
          type: string
        totp_code:
          type: string
        backupCode:
          type: string
        backup_code:
          type: string

    RegisterCompleteRequest:
      type: object
      required:
        - auth_state_id
        - user_public_key
        - user_public_pq_key
        - encrypted_private_key
        - server_key_share
        - password_kdf_salt
        - password_kdf_params_version
        - device_public_key
        - device_share
        - device_fingerprint
        - device_name
      properties:
        auth_state_id:
          type: string
          pattern: '^d{10,20}

        user_public_key:
          type: string
        user_public_pq_key:
          type: string
          description: ML-KEM-768 encapsulation key (1184 raw bytes), standard base64
        encrypted_private_key:
          $ref: "#/components/schemas/EncryptedBlob"
        server_key_share:
          type: string
        password_kdf_salt:
          type: string
        password_kdf_params_version:
          type: integer
          enum: [1, 2]
        device_public_key:
          type: string
        device_share:
          type: string
        device_fingerprint:
          type: string
        device_name:
          type: string
        personal_workspace_name:
          type: string
          maxLength: 128
          description: Optional display name for default personal workspace and vault; omit for server default "Personal"
        platform:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        app_version:
          type: string
        client_type:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          properties:
            platform:
              type: string
            os_name:
              type: string
            os_version:
              type: string
            app_version:
              type: string
            client_type:
              type: string
            user_agent:
              type: string
            crypto_capable:
              type: boolean

    RegisterCompleteResponse:
      type: object
      required: [user_id, workspace_id, vault_id, device_id, device_status]
      properties:
        user_id:
          type: string
          pattern: '^d{10,20}

        workspace_id:
          type: string
          pattern: '^d{10,20}

        vault_id:
          type: string
          pattern: '^d{10,20}

        device_id:
          type: string
          pattern: '^d{10,20}

        device_status:
          type: string
          enum: [trusted]

    Vault:
      type: object
      required: [id, workspaceId, name, isPersonal, ownerId, cryptoVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^d{10,20}

        workspaceId:
          type: string
          pattern: '^d{10,20}

        name:
          type: string
        isPersonal:
          type: boolean
        ownerId:
          type: string
          pattern: '^d{10,20}

          nullable: true
        cryptoVersion:
          type: integer
          minimum: 1
          maximum: 65535
          description: Vault crypto profile version (floor); new vaults use v2; cannot downgrade.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Workspace:
      type: object
      required: [id, name, ownerId, planTier, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^d{10,20}

        name:
          type: string
        ownerId:
          type: string
          pattern: '^d{10,20}

        planTier:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SyncEvent:
      type: object
      required:
        [
          id,
          vaultId,
          actorId,
          eventType,
          encryptedBlob,
          idempotencyKey,
          clientCreatedAt,
          version,
          createdAt,
        ]
      properties:
        id:
          type: string
          pattern: '^d{10,20}

        vaultId:
          type: string
          pattern: '^d{10,20}

        actorId:
          type: string
          pattern: '^d{10,20}

          nullable: true
        eventType:
          type: string
          enum:
            - ITEM_CREATE
            - ITEM_UPDATE
            - ITEM_DELETE
            - FOLDER_CREATE
            - FOLDER_UPDATE
            - FOLDER_DELETE
            - ITEM_FOLDER_ASSIGN
            - VAULT_CREATE
            - VAULT_SHARE
            - VAULT_KEY_ROTATION
            - DEVICE_ADD
            - DEVICE_REMOVE
        encryptedBlob:
          $ref: "#/components/schemas/EncryptedBlob"
        signature:
          $ref: "#/components/schemas/HybridSignatureEnvelope"
          nullable: true
        idempotencyKey:
          type: string
          pattern: '^d{10,20}

          nullable: true
        clientCreatedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    SyncEventsListResponse:
      type: object
      required: [vaultId, afterVersion, events]
      properties:
        vaultId:
          type: string
          pattern: '^d{10,20}

        afterVersion:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: "#/components/schemas/SyncEvent"

    SyncAppendRequest:
      type: object
      required: [eventType, encryptedBlob, baseVersion]
      properties:
        eventType:
          type: string
        encryptedBlob:
          $ref: "#/components/schemas/EncryptedBlob"
        signature:
          $ref: "#/components/schemas/HybridSignatureEnvelope"
          description: >
            Hybrid integrity signature (`context = sync.append`).
            Required by strict rollout policy for critical event types.
        baseVersion:
          type: integer
          minimum: 0
        idempotencyKey:
          type: string
          pattern: '^d{10,20}

        clientCreatedAt:
          type: string
          format: date-time

    VaultKeyResponse:
      type: object
      required: [encryptedVaultKey]
      properties:
        encryptedVaultKey:
          $ref: "#/components/schemas/EncryptedBlob"

    VaultShareMember:
      type: object
      required: [userId, email, publicKey, publicPqKey, role, encryptedVaultKey]
      properties:
        userId:
          type: string
          pattern: '^d{10,20}

        email:
          type: string
          format: email
        publicKey:
          type: string
        publicPqKey:
          type: string
          nullable: true
          description: ML-KEM-768 encapsulation key (base64); null for legacy users
        role:
          type: string
          nullable: true
        encryptedVaultKey:
          $ref: "#/components/schemas/EncryptedBlob"
          nullable: true

    VaultSharesResponse:
      type: object
      required: [vaultId, members]
      properties:
        vaultId:
          type: string
          pattern: '^d{10,20}

        members:
          type: array
          items:
            $ref: "#/components/schemas/VaultShareMember"

    VaultShareUpsertRequest:
      type: object
      required: [recipientUserId, encryptedVaultKey, encryptedPayload, signature, baseVersion]
      properties:
        recipientUserId:
          type: string
          pattern: '^d{10,20}

        encryptedVaultKey:
          $ref: "#/components/schemas/EncryptedBlob"
          description: >
            Recipient wrapped vault key.
            In production hybrid-by-default path, must use `crypto_version >= 2`
            and include `meta.key_wrap_scheme = "hybrid_ecc_pq_v1"`.
        encryptedPayload:
          $ref: "#/components/schemas/EncryptedBlob"
        signature:
          $ref: "#/components/schemas/HybridSignatureEnvelope"
          description: >
            Hybrid integrity signature (`context = vault.share`).
        baseVersion:
          type: integer
          minimum: 0
        idempotencyKey:
          type: string
          pattern: '^d{10,20}

        clientCreatedAt:
          type: string
          format: date-time
        role:
          type: string

    VaultShareRevokeRequest:
      type: object
      required: [recipientUserId, rotatedVaultKeys, encryptedPayload, signature, baseVersion]
      properties:
        recipientUserId:
          type: string
          pattern: '^d{10,20}

        rotatedVaultKeys:
          type: array
          minItems: 1
          items:
            type: object
            required: [userId, encryptedVaultKey]
            properties:
              userId:
                type: string
                pattern: '^d{10,20}

              encryptedVaultKey:
                $ref: "#/components/schemas/EncryptedBlob"
                description: >
                  Rotated recipient wrapped vault key.
                  In production hybrid-by-default path, must use `crypto_version >= 2`
                  and include `meta.key_wrap_scheme = "hybrid_ecc_pq_v1"`.
        encryptedPayload:
          $ref: "#/components/schemas/EncryptedBlob"
        signature:
          $ref: "#/components/schemas/HybridSignatureEnvelope"
          description: >
            Hybrid integrity signature (`context = vault.revoke`).
        baseVersion:
          type: integer
          minimum: 0
        idempotencyKey:
          type: string
          pattern: '^d{10,20}

        clientCreatedAt:
          type: string
          format: date-time

    VaultShareStateResponse:
      type: object
      properties:
        shared:
          type: boolean
        revoked:
          type: boolean
        rotated:
          type: boolean
        updated:
          type: boolean

    VaultKeyRotateRequest:
      type: object
      required: [rotatedVaultKeys, encryptedPayload, signature, baseVersion]
      properties:
        rotatedVaultKeys:
          type: array
          minItems: 1
          items:
            type: object
            required: [userId, encryptedVaultKey]
            properties:
              userId:
                type: string
                pattern: '^d{10,20}

              encryptedVaultKey:
                $ref: "#/components/schemas/EncryptedBlob"
                description: >
                  Re-wrapped vault key for this recipient.
                  In production hybrid-by-default path must use `crypto_version >= 2`
                  and `meta.key_wrap_scheme = "hybrid_ecc_pq_v1"`.
        encryptedPayload:
          $ref: "#/components/schemas/EncryptedBlob"
        signature:
          $ref: "#/components/schemas/HybridSignatureEnvelope"
          description: >
            Hybrid integrity signature (`context = vault.rotate`).
        baseVersion:
          type: integer
          minimum: 0
        idempotencyKey:
          type: string
          pattern: '^d{10,20}

        clientCreatedAt:
          type: string
          format: date-time
        reason:
          type: string
          enum: [security_incident, manual]
          description: Informational rotation reason.

    VaultMemberRoleUpdateRequest:
      type: object
      required: [newRole, rotatedVaultKeys, encryptedPayload, signature, baseVersion]
      properties:
        newRole:
          type: string
          description: New role for the member (e.g. "admin", "member").
        rotatedVaultKeys:
          type: array
          minItems: 1
          items:
            type: object
            required: [userId, encryptedVaultKey]
            properties:
              userId:
                type: string
                pattern: '^d{10,20}

              encryptedVaultKey:
                $ref: "#/components/schemas/EncryptedBlob"
                description: >
                  Re-wrapped vault key for this recipient.
                  Must follow the hybrid-by-default contract in production.
        encryptedPayload:
          $ref: "#/components/schemas/EncryptedBlob"
        signature:
          $ref: "#/components/schemas/HybridSignatureEnvelope"
          description: >
            Hybrid integrity signature (`context = vault.member_role_update`).
        baseVersion:
          type: integer
          minimum: 0
        idempotencyKey:
          type: string
          pattern: '^d{10,20}

        clientCreatedAt:
          type: string
          format: date-time

    CapsuleMetadata:
      type: object
      required:
        [capsuleId, type, expiresAt, maxViews, viewCount, passwordRequired, createdAt]
      properties:
        capsuleId:
          type: string
          pattern: '^d{10,20}

        type:
          type: string
          enum: [item, field, file]
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxViews:
          type: integer
          nullable: true
        viewCount:
          type: integer
          minimum: 0
        passwordRequired:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CapsuleOpenResponse:
      allOf:
        - $ref: "#/components/schemas/CapsuleMetadata"
        - type: object
          required: [encryptedPayload]
          properties:
            encryptedPayload:
              $ref: "#/components/schemas/EncryptedBlob"
            filePayload:
              $ref: "#/components/schemas/EncryptedBlob"

    CapsuleCreateRequest:
      type: object
      required: [type, encryptedPayload]
      properties:
        type:
          type: string
          enum: [item, field, file]
        encryptedPayload:
          $ref: "#/components/schemas/EncryptedBlob"
        filePayload:
          $ref: "#/components/schemas/EncryptedBlob"
        keyTransportMode:
          type: string
          enum: [fragment, out_of_band]
          default: out_of_band
        expiresAt:
          type: string
          format: date-time
        maxViews:
          type: integer
          minimum: 1
          maximum: 10000
        password:
          type: string
        allowedRecipientEmails:
          type: array
          items:
            type: string
            format: email

    EncryptedBlob:
      type: object
      required: [crypto_version, algorithm, payload, meta]
      properties:
        crypto_version:
          type: integer
          minimum: 1
          maximum: 65535
        algorithm:
          type: string
        payload:
          type: string
          description: Standard base64 ciphertext
        meta:
          type: object
          additionalProperties: true
    HybridSignatureEnvelope:
      type: object
      required:
        [
          version,
          algorithm,
          key_id,
          context,
          signer_pq_public_key,
          payload_hash,
          signature,
          created_at,
        ]
      properties:
        version:
          type: integer
          enum: [1]
        algorithm:
          type: string
          enum: [hybrid_ed25519_pq_bind_v1]
        key_id:
          type: string
        context:
          type: string
          enum:
            - sync.append
            - vault.share
            - vault.revoke
            - vault.rotate
            - vault.member_role_update
        signer_pq_public_key:
          type: string
        payload_hash:
          type: string
        signature:
          type: string
        created_at:
          type: string
          format: date-time

    DeviceRegisterRequest:
      type: object
      required:
        - device_public_key
        - device_share
        - device_fingerprint
        - device_name
      properties:
        device_public_key:
          type: string
        device_share:
          type: string
        device_fingerprint:
          type: string
        device_name:
          type: string
        platform:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        app_version:
          type: string
        client_type:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          properties:
            platform:
              type: string
            os_name:
              type: string
            os_version:
              type: string
            app_version:
              type: string
            client_type:
              type: string
            user_agent:
              type: string

    DeviceRegisterResponse:
      type: object
      required: [device_id, status]
      properties:
        device_id:
          type: string
          pattern: '^d{10,20}

        status:
          type: string
          enum: [trusted, pending_approval]

    DeviceResolveResponse:
      type: object
      required: [device_id, status]
      properties:
        device_id:
          type: string
          pattern: '^d{10,20}

        status:
          type: string
          enum: [trusted, revoked]

    DeviceRejectRequest:
      type: object
      properties:
        reason:
          type: string

  parameters:
    HeaderUserId:
      name: X-User-Id
      in: header
      required: false
      description: >
        Optional dev fallback (disabled in production unless explicitly allowed).
        Prefer `Authorization: Bearer <access_token>` from
        `POST /auth/session/bootstrap` or `POST /auth/two-factor/verify`.
      schema:
        type: string
        pattern: '^d{10,20}

    HeaderDeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        pattern: '^d{10,20}


paths:
  /health:
    get:
      tags: [System]
      summary: Liveness
      responses:
        "200":
          description: OK

  /ready:
    get:
      tags: [System]
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready

  /auth/email/start:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailStartRequest"
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "400":
          description: Validation / bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/email/resend:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailResendRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallengeResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/email/confirm:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailConfirmResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/register/complete:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCompleteRequest"
      responses:
        "201":
          description: User registered with default workspace, vault, trusted device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterCompleteResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/session/bootstrap:
    post:
      tags: [Auth]
      summary: Create session after email confirm (no 2FA pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionBootstrapRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/verify:
    post:
      tags: [Auth]
      summary: Complete login with TOTP or backup code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          description: >
            Includes TWO_FACTOR_INVALID_CODE, TWO_FACTOR_BACKUP_INVALID, TWO_FACTOR_BACKUP_DEPLETED,
            TWO_FACTOR_SETUP_INVALID, TWO_FACTOR_NOT_ENABLED, AUTH_BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/two-factor/status:
    get:
      tags: [Auth]
      summary: Two-factor status for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HeaderUserId"
      responses:
        "200":
          content:
            application/json:
              schema:
