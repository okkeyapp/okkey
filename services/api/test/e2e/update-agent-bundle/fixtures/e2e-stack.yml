# Disposable compose project for the offline-bundle update-agent e2e.
# Production service set only: api/web/worker (enterprise images replace these).
# Image tags are replaced by the test harness before `compose up`.
services:
  api:
    image: ${OKKEY_E2E_BASE_IMAGE}
    environment:
      OKKEY_VERSION: "1.0.0"
      OKKEY_IMAGE_TAG: "1.0.0"
      OKKEY_ENTERPRISE_VERSION: "1.0.0"
      OKKEY_ENTERPRISE_IMAGE_TAG: "1.0.0"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 0s
  web:
    image: ${OKKEY_E2E_BASE_IMAGE}
    environment:
      OKKEY_IMAGE_TAG: "1.0.0"
      OKKEY_ENTERPRISE_IMAGE_TAG: "1.0.0"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 0s
  worker:
    image: ${OKKEY_E2E_BASE_IMAGE}
    environment:
      OKKEY_IMAGE_TAG: "1.0.0"
      OKKEY_ENTERPRISE_IMAGE_TAG: "1.0.0"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 0s
