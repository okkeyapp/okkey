# Build Core images and run the Trivy CRITICAL/HIGH gate on pull requests.
#
# Scope: api / worker / web (amd64 only). arm64 stays covered by
# publish-images on release/hotfix/tag/dispatch.
#
# Never logs into a registry and never pushes. Images are written to a local
# docker tar and scanned with the same Trivy pin / severity / ignore-unfixed /
# CVE-exception path as publish-images (via .github/actions/trivy-scan-image).
#
# Always runs on every PR (and merge_group) into the target branches so the
# check names can be required without hanging Pending. Image-relevant path
# detection is inside the workflow: unrelated PRs skip the heavy build+Trivy
# steps with success only when the filter explicitly reports images=false
# (fail-closed otherwise). build-and-scan uses if: always() so a failed or
# cancelled detect-image-paths job cannot soft-pass the required checks.
# Fork PRs need no secrets.
name: PR image scan

on:
  pull_request:
    branches:
      - dev
      - "release/**"
  merge_group:

permissions:
  contents: read
  actions: write # GHA cache for buildx (no registry login or push)
  pull-requests: read # dorny/paths-filter lists PR files via the API

concurrency:
  group: okkey-pr-image-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter only. build-and-scan always runs afterward (if: always) and
  # fails closed when this job did not succeed or when images is not exactly
  # the string "false".
  changes:
    name: detect-image-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout for merge group diff
        if: github.event_name == 'merge_group'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect image-relevant path changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          filters: |
            images:
              - 'services/api/Dockerfile'
              - 'apps/web/Dockerfile'
              - 'services/**'
              - 'apps/web/**'
              - 'apps/extension/package.json'
              - 'packages/**'
              - 'rust/**'
              - 'rust-toolchain.toml'
              - 'scripts/**'
              - 'deploy/**'
              - 'package.json'
              - 'yarn.lock'
              - '.dockerignore'
              - '.github/workflows/pr-image-scan.yml'
              - '.github/workflows/publish-images.yml'
              - '.github/actions/trivy-scan-image/**'
              - '.github/security/cve-exceptions.yaml'

  build-and-scan:
    name: build-and-scan (${{ matrix.image }})
    needs: changes
    # Do not soft-pass when detect-image-paths fails or is cancelled: skipped
    # dependents are treated as passing for required checks.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: services/api/Dockerfile
            target: api
            cache_scope: services-api
          - image: worker
            file: services/api/Dockerfile
            target: worker
            cache_scope: services-api
          - image: web
            file: apps/web/Dockerfile
            target: runtime
            cache_scope: web
    steps:
      - name: Require path detection success
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "detect-image-paths concluded with '${{ needs.changes.result }}'; refusing to soft-pass the image scan gate." >&2
          exit 1

      - name: Skip heavy work when unrelated
        if: needs.changes.result == 'success' && needs.changes.outputs.images == 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "No image-relevant paths changed; skipping build and Trivy (check stays green)."

      - name: Checkout
        if: needs.changes.result == 'success' && needs.changes.outputs.images != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Prefer PR / merge-group head so image contents match the change under test.
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - name: Set up Docker Buildx
        if: needs.changes.result == 'success' && needs.changes.outputs.images != 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image to local tar
        id: build
        if: needs.changes.result == 'success' && needs.changes.outputs.images != 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          # No registry: write a single-platform docker tar for Trivy.
          push: false
          outputs: type=docker,dest=/tmp/okkey-${{ matrix.image }}.tar
          # Local load/tar cannot carry the multi-manifest attestations used on
          # publish push-by-digest; layers and Dockerfile match publish builds.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}-linux-amd64
          build-args: |
            NODE_VERSION=25
            RUST_TOOLCHAIN=1.86.0
            WASM_PACK_VERSION=0.13.1
            OKKEY_GIT_SHA=${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - name: Prepare Trivy report paths
        id: reports
        if: needs.changes.result == 'success' && needs.changes.outputs.images != 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-reports
          echo "table=/tmp/trivy-reports/okkey-${{ matrix.image }}-amd64.txt" >> "$GITHUB_OUTPUT"
          echo "sarif=/tmp/trivy-reports/okkey-${{ matrix.image }}-amd64.sarif" >> "$GITHUB_OUTPUT"

      - name: Scan image with Trivy
        if: needs.changes.result == 'success' && needs.changes.outputs.images != 'false'
        uses: ./.github/actions/trivy-scan-image
        with:
          image: ${{ matrix.image }}
          input: /tmp/okkey-${{ matrix.image }}.tar
          table-output: ${{ steps.reports.outputs.table }}
          sarif-output: ${{ steps.reports.outputs.sarif }}

      - name: Upload Trivy reports
        if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.images != 'false' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.image }}-amd64
          path: /tmp/trivy-reports/*
          if-no-files-found: warn
          retention-days: 14
