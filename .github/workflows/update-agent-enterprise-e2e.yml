name: Update Agent Enterprise E2E

on:
  pull_request:
  push:
    branches:
      - dev
      - "release/**"

concurrency:
  group: update-agent-enterprise-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update-agent-enterprise-e2e:
    name: update-agent-enterprise-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install htpasswd
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Run enterprise update-agent e2e
        run: node --experimental-strip-types services/api/test/e2e/update-agent-enterprise/run.ts
