name: Crypto Fuzz Extended

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  crypto-fuzz-extended:
    name: crypto-fuzz-extended
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: PATH="$HOME/.cargo/bin:$PATH" cargo install cargo-fuzz --locked

      - name: Run extended fuzz budget
        run: cd rust/crypto-engine && PATH="$HOME/.cargo/bin:$PATH" cargo +nightly fuzz run hybrid_decode -- -seed=202601 -max_total_time=300 && PATH="$HOME/.cargo/bin:$PATH" cargo +nightly fuzz run hybrid_decrypt -- -seed=202602 -max_total_time=300 && PATH="$HOME/.cargo/bin:$PATH" cargo +nightly fuzz run signature_verify -- -seed=202603 -max_total_time=300
