name: Trigger dev deployment

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    name: trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch deployment
        env:
          DISPATCH_TOKEN: ${{ secrets.DEV_DEPLOY_DISPATCH_TOKEN }}
          DISPATCH_URL: ${{ secrets.DEV_DEPLOY_DISPATCH_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN}" || -z "${DISPATCH_URL}" ]]; then
            echo "Dispatch secrets are not configured; skipping."
            echo "Set DEV_DEPLOY_DISPATCH_TOKEN and DEV_DEPLOY_DISPATCH_URL on this repository."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "{\"event_type\":\"okkey-dev-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF}\"}}" \
            "${DISPATCH_URL}"
          echo "Dispatch sent."
