name: Crypto Fuzz Quick

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  crypto-fuzz-quick:
    name: crypto-fuzz-quick
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.86.0
      RUST_NIGHTLY_TOOLCHAIN: nightly-2026-03-20
      WASM_PACK_VERSION: 0.13.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: yarn

      - name: Bootstrap crypto-wasm path for Yarn
        run: node scripts/ensure-crypto-wasm-dist.mjs

      - name: Setup pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_TOOLCHAIN }}

      - name: Install pinned stable Rust toolchain
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal

      - name: Install wasm-pack
        run: PATH="$HOME/.cargo/bin:$PATH" cargo install wasm-pack --version $WASM_PACK_VERSION --locked

      - name: Add WebAssembly target (stable)
        run: rustup target add wasm32-unknown-unknown --toolchain $RUST_TOOLCHAIN

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install cargo-fuzz
        run: yarn fuzz:crypto:install

      - name: Run property tests (Rust + WASM/TS)
        run: yarn test:crypto:property

      - name: Run cross-layer contract tests
        run: yarn test:crypto:contracts

      - name: Run quick fuzz budget
        run: RUST_NIGHTLY_TOOLCHAIN=$RUST_NIGHTLY_TOOLCHAIN yarn fuzz:crypto:quick
