name: Security Suite

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  security-suite:
    name: security-suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: okkey
          POSTGRES_USER: okkey
          POSTGRES_PASSWORD: okkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okkey -d okkey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://okkey:okkey@localhost:5432/okkey
      REDIS_URL: redis://localhost:6379
      DEPLOY_ENV: dev
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret
      SESSION_SECRET: test-session-secret
      EMAIL_PROVIDER: logger
      EMAIL_DEFAULT_LOCALE: en
      EMAIL_FROM: no-reply@okkey.local
      CRYPTO_ALLOWED_PROFILE_VERSIONS: 1,2
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: okkey
      S3_ACCESS_KEY: okkey
      S3_SECRET_KEY: okkey-minio
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: yarn

      - name: Bootstrap crypto-wasm path for Yarn
        run: node scripts/ensure-crypto-wasm-dist.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Add WebAssembly target (stable)
        run: rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Q-Day security suite (blocking)
        run: yarn test:security
