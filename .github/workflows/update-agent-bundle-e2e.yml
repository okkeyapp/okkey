# Real Docker e2e for offline update bundles (core then enterprise).
# Uses a local registry:2 instead of GHCR. Signing keys are generated at runtime.
name: Update agent bundle e2e

on:
  pull_request:
    branches:
      - dev
      - "release/**"
  push:
    branches:
      - dev
      - "release/**"

concurrency:
  group: update-agent-bundle-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update-agent-bundle-e2e:
    name: update-agent-bundle-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      # Local registry:2 speaks plain HTTP. Keep the pull/push path off GHCR.
      - name: Allow the local registry over HTTP
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries":["127.0.0.1:5000"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info >/dev/null

      - name: Run offline bundle update-agent e2e
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            services/api/test/e2e/update-agent-bundle/update-agent-bundle.e2e.ts
