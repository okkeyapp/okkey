name: Feature request
description: Suggest a change to Okkey.
labels: ["enhancement"]
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved and the behavior you want.
        Security vulnerabilities belong in SECURITY.md, not in this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the product stop you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Okkey do instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional links, screenshots, or related issues.
    validations:
      required: false
